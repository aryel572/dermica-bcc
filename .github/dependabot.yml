# Dependabot semanal — actualizaciones minor agrupadas en un solo PR por ecosistema;
# majors llegan sueltas para revisión manual.
version: 2
# Desactivado tras el release 1.0.0: los bumps automaticos llegaban como majors
# incompatibles con Gradle/AGP y con las versiones pineadas del workspace.
# Reactivar solo tras corregir CI y decidir una politica de actualizaciones.
updates:
  - package-ecosystem: "gradle"
    enabled: false
    directory: "/android"
    schedule:
      interval: "weekly"
    groups:
      grouped-minor:
        update-types: ["minor"]

  # pip por cada pyproject.toml del workspace uv (raíz virtual + miembros virtuales)
  - package-ecosystem: "pip"
    enabled: false
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      grouped-minor:
        update-types: ["minor"]

  - package-ecosystem: "pip"
    enabled: false
    directory: "/shared"
    schedule:
      interval: "weekly"
    groups:
      grouped-minor:
        update-types: ["minor"]

  - package-ecosystem: "pip"
    enabled: false
    directory: "/pipeline"
    schedule:
      interval: "weekly"
    groups:
      grouped-minor:
        update-types: ["minor"]

  - package-ecosystem: "pip"
    enabled: false
    directory: "/model"
    schedule:
      interval: "weekly"
    groups:
      grouped-minor:
        update-types: ["minor"]

  - package-ecosystem: "pip"
    enabled: false
    directory: "/server"
    schedule:
      interval: "weekly"
    groups:
      grouped-minor:
        update-types: ["minor"]
