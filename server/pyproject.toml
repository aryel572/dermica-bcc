# dermica-server — miembro VIRTUAL del workspace (sin [build-system]).
# server/requirements.txt se conserva SOLO para Render (render.yaml buildCommand);
# es una traducción literal de estas dependencias, con las mismas versiones.
[project]
name = "dermica-server"
version = "1.0.0"
description = "FastAPI pública: distribución del modelo 1.0.0 (/healthz, /model/version, /model/latest, /model/download)."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "huggingface-hub==2.4.0",
]
